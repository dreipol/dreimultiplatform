buildscript {
    repositories {
        google()
        maven {
            url = uri("https://plugins.gradle.org/m2/")
        }

    }

    dependencies {
        classpath("com.android.tools.build:gradle:$versions_android_gradle_plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$versions_kotlin")
        classpath("org.jlleitschuh.gradle:ktlint-gradle:$versions_linter")
        classpath "org.jetbrains.dokka:dokka-gradle-plugin:$versions_dokka"
        classpath "io.github.gradle-nexus:publish-plugin:$versions_nexus_publish"
    }
}

plugins {
    id("com.android.library")
    id("org.jetbrains.kotlin.multiplatform")
    id("maven-publish")
    id("signing")
    id("co.touchlab.skie") version "0.8.4"
}
apply plugin: "org.jlleitschuh.gradle.ktlint"
apply plugin: "org.jetbrains.dokka"


allprojects {
    repositories {
        mavenCentral()
        google()
    }
}

group = "ch.dreipol"


kotlin {
    jvmToolchain(17)

    iosX64() {
        binaries {
            framework()
        }
    }

    iosArm64() {
        binaries {
            framework()
        }
    }

    iosSimulatorArm64() {
        binaries {
            framework()
        }
    }

    androidTarget {
        compilations.configureEach {
            kotlinOptions {
                jvmTarget = 17
            }
        }
    }

    android() {
        publishAllLibraryVariants()
    }

    sourceSets {
        commonMain.dependencies {
            api("org.jetbrains.kotlinx:kotlinx-coroutines-core:$versions_coroutines")
            implementation("org.jetbrains.kotlinx:kotlinx-datetime:$datetime_version")
            api("org.reduxkotlin:redux-kotlin-threadsafe:$versions_redux_kotlin")
            api("org.reduxkotlin:redux-kotlin-thunk:$versions_redux_kotlin_thunk")
            api("co.touchlab:kermit:$versions_kermit")
            implementation("org.jetbrains.kotlinx:kotlinx-serialization-json:$json_serialization_version")
        }

        commonTest.dependencies {
            implementation(kotlin('test'))
        }

        androidMain.dependencies {
            implementation "org.jetbrains.kotlin:kotlin-stdlib:$versions_kotlin"
            implementation("androidx.appcompat:appcompat:$versions_app_compat")
            implementation("com.google.android.play:review:$versions_play_review")
            implementation("com.google.android.play:review-ktx:$versions_play_review")
            api("org.jetbrains.kotlinx:kotlinx-datetime:$datetime_version")
        }

        iosMain.dependencies {
            api("co.touchlab:kermit-simple:$versions_kermit")
        }
    }

    //    TODO: Remove as soon as Android Studio (Iguana) is fixed
    task("testClasses")
}

android {
    namespace "ch.dreipol.dreimultiplatform"

    compileSdk 34
    defaultConfig {
        minSdkVersion 23
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            manifest.srcFile 'src/androidMain/AndroidManifest.xml'
        }
    }
    buildTypes {
        //This is for MultiplatformSettings
        debug {
            // MPP libraries don't currently get this resolution automatically
            matchingFallbacks = ['release']
        }
        release {
            minifyEnabled false
        }
    }
}


// workaround for https://youtrack.jetbrains.com/issue/KT-27170
configurations {
    compileClasspath
}

ktlint {
    ignoreFailures.set(false)
    filter {
        exclude { element -> element.file.path.contains("generated/") }
        exclude { element -> element.file.path.contains("reduxkotlin/") }
    }
}

tasks["build"].dependsOn("ktlintFormat")

task dokkaJavadocCommonJar(type: Jar, dependsOn: dokkaHtml, group: 'publishing') {
    from "$buildDir/javadoc/common"
    archiveClassifier.set("javadoc")
}

if (project == project.rootProject) {
    apply plugin: "io.github.gradle-nexus.publish-plugin"

    publishing {
        publications.all { pub ->
            pom.withXml {
                def root = asNode()

                root.children().last() + {
                    resolveStrategy = DELEGATE_FIRST

                    name 'dreimultiplatform'
                    description 'Shared Repository for KMM projects'
                    url 'https://github.com/dreipol/dreimultiplatform'
                    scm {
                        url 'https://github.com/dreipol/dreimultiplatform'
                        connection 'scm:https://github.com/dreipol/dreimultiplatform.git'
                        developerConnection 'scm:git://github.com/dreipol/dreimultiplatform.git'
                    }
                    licenses {
                        license {
                            name 'The MIT License'
                            url 'https://opensource.org/licenses/MIT'
                            distribution 'repo'
                        }
                    }
                    developers {
                        developer {
                            id 'melbic'
                            name 'Samuel Bichsel'
                            email 'samuel.bichsel@dreipol.ch'
                        }
                        developer {
                            id 'kaiwidmer'
                            name 'Kai Widmer'
                            email 'kai.widmer@dreipol.ch'
                        }
                        developer {
                            id 'tschuls'
                            name 'Julia Strasser'
                            email 'julia.strasser@dreipol.ch'
                        }
                        developer {
                            id 'lailabecker'
                            name 'Laila Becker'
                            email 'laila.becker@dreipol.ch'

                        }
                    }
                }
            }

            artifact dokkaJavadocCommonJar
        }

        signing {
            def signingKey = System.getenv("PGP_KEY")
            def signingPassword = ""
            if (project.hasProperty('signing.password')) {
                signingPassword = project.getProperty('signing.password')
            }
            useInMemoryPgpKeys(signingKey, signingPassword)
            sign publishing.publications
        }

        nexusPublishing {
            repositories {
                sonatype {
                    nexusUrl = uri("https://s01.oss.sonatype.org/service/local/")
                    snapshotRepositoryUrl = uri("https://s01.oss.sonatype.org/content/repositories/snapshots/")
                }
            }
        }
    }
}